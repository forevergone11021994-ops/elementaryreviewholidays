  --bg:#fbf2ff; --bg2:#fff7fb; --card:#ffffff; --ink:#43305f; --muted:#8a78a6;
  --pink:#ff9ec7; --pink-soft:#ffe3f0; --lilac:#c9b2ff; --lilac-soft:#efe7ff;
  --mint:#7fdcb9; --mint-soft:#dcf8ec; --sun:#ffd970; --sun-soft:#fff5cf; --red:#ff7b8e; --red-soft:#ffe2e7;
  --line:#ecdcff; --shadow:0 8px 0 #ead9ff, 0 14px 28px rgba(150,110,210,.18);
  --f-head:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif; --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;min-height:100vh;
  background-image:var(--bgimg),var(--bgfallback,radial-gradient(circle at 8% 12%,#ffe3f0 0 90px,transparent 91px),radial-gradient(circle at 94% 20%,#e3fff3 0 110px,transparent 111px),radial-gradient(circle at 85% 92%,#fff3c9 0 120px,transparent 121px),radial-gradient(circle at 6% 88%,#ece3ff 0 100px,transparent 101px));
  background-size:cover;background-position:center;background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;background:rgba(251,242,255,.92);backdrop-filter:blur(6px);border-bottom:2px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-head);font-weight:800;font-size:22px;line-height:1}
.logo span{color:#e46aa3}
.bar{flex:1;min-width:140px;height:14px;border-radius:99px;background:var(--lilac-soft);overflow:hidden;border:2px solid #fff;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--lilac));border-radius:99px;transition:width .35s}
.step{font-weight:800;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tbtn{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px}

main{max-width:980px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
.page{background:rgba(255,255,255,.9);border-radius:34px;box-shadow:var(--shadow);border:3px solid #fff;padding:26px clamp(16px,3vw,34px) 30px;animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(8px)}}
.tag{display:inline-block;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:3px 12px;border-radius:99px;background:var(--pink-soft);color:#c9488a}
.tag.v{background:var(--mint-soft);color:#2a8a66}.tag.s{background:var(--sun-soft);color:#a87800}
h1,h2{font-family:var(--f-head);margin:8px 0 6px;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(34px,6vw,54px)}
h2{font-size:clamp(24px,3.6vw,32px)}
h2 .n{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--lilac);color:#fff;margin-right:8px;font-size:24px;vertical-align:middle}
.instr{color:var(--muted);font-weight:700;margin:0 0 16px}

/* choose option */
.items{display:flex;flex-direction:column;gap:10px;counter-reset:it}
.it{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-radius:20px;background:var(--bg2);border:2px solid transparent;line-height:2.1}
.it>b{flex:none;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);display:inline-grid;place-items:center;font-size:14px;line-height:1;align-self:center}
.it .tx{min-width:0}
.opts{display:inline-flex;gap:4px;padding:2px;border-radius:99px;background:#fff;border:2px dashed var(--lilac);vertical-align:middle;line-height:1.2}
.opts button{border:0;background:transparent;border-radius:99px;padding:4px 12px;font-weight:800;color:var(--ink)}
.opts button:hover{background:var(--lilac-soft)}
.opts button.sel{background:var(--lilac);color:#fff}
.opts.ok{border-style:solid;border-color:var(--mint)}.opts.ok button.sel{background:var(--mint);color:#0e4a35}
.opts.bad{border-style:solid;border-color:var(--red)}.opts.bad button.sel{background:var(--red);color:#fff}

/* gaps */
.text{background:var(--bg2);border-radius:24px;padding:16px 18px;line-height:2.4}
.text p{margin:0 0 6px}
.gap{display:inline-flex;align-items:baseline;gap:2px;vertical-align:baseline}
.gap sup{font-weight:800;color:#c9488a;font-size:12px}
.gap .pre{font-weight:800;color:var(--muted)}
input.g{border:0;border-bottom:3px solid var(--lilac);background:var(--lilac-soft);border-radius:10px 10px 4px 4px;padding:2px 8px;font-weight:800;min-width:70px;text-align:center}
input.g.ok,input.w.ok{background:var(--mint-soft);border-color:var(--mint)}
input.g.bad,input.w.bad{background:var(--red-soft);border-color:var(--red)}
.dlg{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:baseline}
.dlg .who{font-family:var(--f-head);font-weight:800;color:#c9488a}
.dlg .who.b{color:#5a8fe0}

/* rewrite */
.rw{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:20px;background:var(--bg2)}
.rw .q{font-weight:700}
.rw .q em{font-style:normal;font-weight:800;background:var(--sun-soft);border-radius:8px;padding:0 8px;margin-left:6px}
input.w{width:100%;border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:16px;padding:10px 14px;font-weight:700}

/* match */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:14px}
@media (max-width:640px){.match{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}}
.col{display:flex;flex-direction:column;gap:8px}
.mi{border:2px solid var(--line);background:#fff;border-radius:18px;padding:9px 12px;text-align:left;font-weight:800;display:flex;gap:8px;align-items:center;min-height:52px;position:relative}
.mi .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--lilac-soft);display:grid;place-items:center;font-size:13px}
.mi.sel{border-color:var(--pink);background:var(--pink-soft);transform:scale(1.02)}
.mi .pair{margin-left:auto;font-size:13px;padding:1px 8px;border-radius:99px;color:#fff}
.mi.ok{border-color:var(--mint)}.mi.bad{border-color:var(--red)}

/* sort */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border-radius:22px;background:var(--bg2);border:2px dashed var(--lilac);min-height:64px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:800}
.chip.sel{background:var(--sun);border-color:var(--sun)}
.chip.ok{background:var(--mint-soft);border-color:var(--mint)}.chip.bad{background:var(--red-soft);border-color:var(--red)}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:700px){.groups{grid-template-columns:minmax(0,1fr)}}
.grp{border:3px solid var(--line);border-radius:26px;padding:12px;background:#fff;min-height:150px;display:flex;flex-direction:column;gap:8px;text-align:left}
.grp h3{margin:0;font-family:var(--f-head);font-size:20px;line-height:1.1}
.grp .in{display:flex;flex-wrap:wrap;gap:6px}
.grp.ready{border-color:var(--sun);background:var(--sun-soft)}

/* listening */
.audio{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:24px;background:var(--sun-soft);border:2px dashed var(--sun);margin-bottom:14px}
.audio audio{width:100%}
.audio label{font-weight:800}
.lis{display:flex;flex-direction:column;gap:10px}
.lis .row{display:flex;flex-direction:column;gap:4px}
.lis .row b{font-weight:800}
.lis .row b span{color:#c9488a}

/* actions */
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.btn{border:0;border-radius:99px;padding:11px 20px;font-weight:800;background:var(--lilac);color:#fff;box-shadow:0 5px 0 #a98bf0}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a98bf0}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 #e57dab}
.btn.mint{background:var(--mint);color:#0e4a35;box-shadow:0 5px 0 #4fbf96}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.big{font-family:var(--f-head);font-size:22px;padding:12px 30px}
.score{font-family:var(--f-head);font-weight:800;font-size:22px}
.score.ok{color:#2a8a66}.score.mid{color:#c98a00}
.hint{background:var(--sun-soft);border-radius:18px;padding:10px 14px;font-weight:700;margin-top:12px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(251,242,255,.94);border-top:2px solid var(--line)}
.nav-in{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;gap:10px}

/* intro */
.hello{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
@media (max-width:640px){.hello{grid-template-columns:minmax(0,1fr)}}
.cloud{font-size:96px;line-height:1;text-align:center;filter:drop-shadow(0 8px 0 #ead9ff)}
.name{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.name input{flex:1;min-width:200px;border:3px solid var(--line);border-radius:99px;padding:12px 18px;font-weight:800;font-size:20px;background:#fff}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px;padding:0;list-style:none}
.plan li{background:var(--bg2);border-radius:16px;padding:8px 12px;font-weight:700;font-size:15px}

/* speaking */
.qcard{background:linear-gradient(135deg,var(--pink-soft),var(--lilac-soft));border-radius:30px;padding:30px 22px;text-align:center;border:3px solid #fff;box-shadow:var(--shadow)}
.qcard .qn{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.qcard .qq{font-family:var(--f-head);font-size:clamp(26px,4.4vw,40px);font-weight:700;line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.starters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.starters span{background:#fff;border-radius:99px;padding:4px 12px;font-weight:700;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.fc{perspective:900px;border:0;background:transparent;padding:0;height:240px;text-align:left}
.fc .inn{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .inn{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:16px;display:flex;flex-direction:column;border:3px solid #fff;box-shadow:0 6px 0 #ead9ff}
.fc .f{align-items:center;justify-content:center;text-align:center;gap:6px}
.fc .f .e{font-size:56px;line-height:1}
.fc .f .t{font-family:var(--f-head);font-size:22px;font-weight:800;line-height:1.1}
.fc .f small{color:var(--muted);font-weight:700}
.fc .b{transform:rotateY(180deg);background:#fff;gap:4px;font-size:15px;overflow:auto}
.fc .b h4{margin:0 0 4px;font-family:var(--f-head);font-size:19px}
.fc .b ul{margin:0;padding-left:18px}
.timerbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.timer{font-family:var(--f-head);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;min-width:90px}

/* results */
table.res{width:100%;border-collapse:separate;border-spacing:0 6px}
table.res td{background:var(--bg2);padding:10px 12px;font-weight:700}
table.res td:first-child{border-radius:14px 0 0 14px}table.res td:last-child{border-radius:0 14px 14px 0;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:14px}
.pill.ok{background:var(--mint-soft);color:#2a8a66}.pill.mid{background:var(--sun-soft);color:#a87800}.pill.no{background:#f1ecf7;color:var(--muted)}
.sent{background:var(--mint-soft);border-radius:18px;padding:12px 14px;font-weight:700;margin-top:12px}
textarea.copy{width:100%;min-height:160px;border:2px solid var(--line);border-radius:16px;padding:10px;font-size:14px;margin-top:10px}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:26px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TEACHER="anastasiaustiniva";

/* answers are compared after this: case, spaces, final punctuation, curly quotes, contractions */
function norm(s){
  return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?,;:]+$/g,"").replace(/[.!?]/g,"")
    .replace(/\bcan't\b/g,"cannot").replace(/\bcan not\b/g,"cannot").replace(/\bwon't\b/g,"will not").replace(/n't\b/g," not")
    .replace(/\s+/g," ").trim();
}
const same=(a,list)=>list.some(x=>norm(a)===norm(x));

const TASKS=[
{id:"g1",sec:"Grammar",n:1,title:"Choose the correct option",instr:"Choose the correct option to complete the sentences.",type:"choice",

{id:"g3",sec:"Grammar",n:3,title:"Negatives and questions",instr:"Rewrite the sentences as negatives (–) or questions (?).",type:"rewrite",

{id:"g4",sec:"Grammar",n:4,title:"Questions in a conversation",instr:"Complete the questions in the conversation. Use the words in brackets and a question word if you need to.",type:"dialog",

{id:"g5",sec:"Grammar",n:5,title:"Listen and write",instr:"Listen and write the six sentences you hear. Include these words.",type:"listen",
 items:["think / things","can / off","bank / road","long / there","anyone / knew","I / what"],
 hint:"Listen again for the little words: <i>those, it, on the right, for, there, you said</i>.",
 ans:[["I think those things are hers."],["Can you turn it off?"],["The bank is on this road on the right."],["How long were you there for?"],["There wasn't anyone I knew there."],["Sorry, I didn't hear what you said."]]},
{id:"v6",sec:"Vocabulary",n:6,title:"Match the phrases",instr:"Match the two parts of the phrases. Tap a word, then tap its pair.",type:"match",
 hint:"You <b>wash</b> your hands, you <b>paint</b> your face, you <b>keep</b> your room tidy.",
 left:["sing","send","go","call","paint","wash","wear","rent","keep","look for"],
 right:["a taxi / an engineer","the dishes / my hands","our faces / the house","my home / a car","a birthday card / someone a gift","songs / Happy Birthday","my glasses / somewhere to live","my room tidy / warm","cycling / for a walk","our national clothes / shorts"],

{id:"v7",sec:"Vocabulary",n:7,title:"Places, home or holidays?",instr:"Decide if these words are about places for things you need, home or holidays. There are five items in each group. Tap a word, then tap a group.",type:"sort",
 hint:"Home: things you do or have at home. Holidays: when you travel.",
 groups:["🏪 Places for things you need","🏠 Home","✈️ Holidays"],
 words:[["apartment",1],["away",2],["bookshop",0],["castle",2],["chemist",0],["cleaning",1],["cooking",1],["furniture",1],["heating",1],["library",0],["post office",0],["sightseeing",2],["sports centre",0],["tour",2],["trip",2]]},
{id:"v8",sec:"Vocabulary",n:8,title:"Choose the correct option",instr:"Choose the correct option to complete the sentences.",type:"choice",
 hint:"Flowers die → they are <i>dead</i>. You <i>come round</i> to someone's house.",
 items:["Do you have a [brush*|shelf] so I can clean the floor?","Do you want to [pick up|come round*] later for dinner?","Is there anywhere [quiet*|noisy] where I can study?","Can I share your book? I [forgot*|moved] mine.","Can you [repair|check*] the window is closed?","I put the flowers in the rubbish. They were [broken|dead*].","Is there anywhere near here I can [change*|find] money?"]},

 hint:"Write the whole word or just the end. Past simple verbs end in -ed: ch… → chatted.",

];

const QUESTIONS=[
 ["What did you do last weekend?",["Last weekend I…","I went to…","I stayed at home and…"]],
 ["Where did you go on your last holiday? Who did you go with?",["I went to…","I went with…"]],
 ["What did you see and do there?",["I saw…","We visited…","Every day we…"]],
 ["Did you ever travel alone? Would you like to?",["I'd like to… because…","I wouldn't like to… because…"]],
 ["What places are there near your home?",["There's a … next to…","There's a … opposite…","There isn't a…"]],
 ["Is there anywhere quiet near your home where you can study?",["I usually study in…","It's quiet because…"]],
 ["Which jobs do you do at home? Do you keep your room tidy?",["I wash the dishes…","I never…","My room is…"]],
 ["What did you do on your last birthday?",["My friends sang…","I got a…","We went to…"]],
 ["What do you wear when it's cold? And when it's hot?",["When it's cold, I wear…","In summer I wear…"]],
 ["What was the weather like last weekend? What did you do?",["It was terrible / sunny, so I…"]]
];
const CARDS=[
 ["🏖️","My best holiday",["Where did you go?","When? Who with?","Where did you stay?","What did you do there?","Was it fantastic or terrible? Why?"]],
 ["🏠","My home",["Is it a house or an apartment?","What's your favourite room?","Who does the cooking and cleaning?","Is it warm in winter?"]],
 ["🗺️","My street",["What is on your road?","Use: on the corner, next to, opposite, at the end of…","Is there a chemist, a bookshop, a library?"]],
 ["🎂","A birthday",["Whose birthday was it?","Did you send a card or a gift?","Who sang Happy Birthday?","What did you eat?"]],
 ["🌧️","A terrible day",["The weather was terrible. Where were you?","What did you do all day?","Were you bored or happy?"]],
 ["🧳","Travel alone",["Would you like to travel alone?","Where would you go?","Would you stay in a hostel? Why?"]],
 ["🎤","Interview your teacher",["Ask 5 questions about the teacher's last weekend:","Did you…? Where did you…? What did you…? Was it…? Who…?"]],
 ["😂","Two truths and a lie",["Say 3 sentences about your last holiday.","Two are true, one is a lie!","Your teacher asks questions and guesses the lie."]]
];

/* ---------- state ---------- */
let page=0,name="";
try{name=localStorage.getItem("rv_name")||""}catch(e){}
const RES={}; // id -> {ok,total,tries}
const STATE={}; // id -> task UI state kept while page is open
const PAGES=[{k:"intro"},...TASKS.map(t=>({k:"task",t})),{k:"speakQ"},{k:"speakC"},{k:"results"}];

function confetti(){
  const c=$("#conf");const set=["☁️","💖","⭐","🌸","✨","🍬"];
  for(let i=0;i<28;i++){const e=document.createElement("i");e.textContent=set[i%set.length];e.style.left=Math.random()*100+"vw";e.style.animationDelay=(Math.random()*.5)+"s";c.appendChild(e);setTimeout(()=>e.remove(),2300)}
}

/* ---------- task builders: each returns {check()->{ok,total}, reset()} ---------- */
function buildChoice(t,box){
  const st=STATE[t.id]||(STATE[t.id]={});
  const wrap=document.createElement("div");wrap.className="items";
  let gi=0;const groups=[];
  t.items.forEach((s,i)=>{
    const row=document.createElement("div");row.className="it";
    const html=esc(s).replace(/\[([^\]]+)\]/g,(m,inner)=>{
      const opts=inner.split("|");const id=gi++;groups.push(opts.findIndex(o=>o.endsWith("*")));
      return `<span class="opts" data-g="${id}">${opts.map((o,j)=>`<button type="button" data-o="${j}">${o.replace("*","")}</button>`).join("")}</span>`;
    });
    row.innerHTML=`<b>${i+1}</b><span class="tx">${html}</span>`;wrap.appendChild(row);
  });
  box.appendChild(wrap);
  const paint=()=>wrap.querySelectorAll(".opts").forEach(o=>{const g=+o.dataset.g;o.querySelectorAll("button").forEach(b=>b.classList.toggle("sel",st[g]===+b.dataset.o))});
  wrap.addEventListener("click",e=>{const b=e.target.closest(".opts button");if(!b)return;const o=b.parentElement;st[+o.dataset.g]=+b.dataset.o;o.classList.remove("ok","bad");paint()});
  paint();
  return {check(){let ok=0;wrap.querySelectorAll(".opts").forEach(o=>{const g=+o.dataset.g;const good=st[g]===groups[g];if(good)ok++;o.classList.toggle("ok",good);o.classList.toggle("bad",!good)});return {ok,total:groups.length}},
    reset(){wrap.querySelectorAll(".opts.bad").forEach(o=>{delete st[+o.dataset.g];o.classList.remove("bad")});paint()}};
}
function gapInput(spec,idx,st,key){
  let pre="",ans=spec;if(spec.includes("~"))[pre,ans]=spec.split("~");
  const list=ans.split("/");const w=Math.max(...list.map(a=>a.length))-pre.length;
  return {html:`<span class="gap"><sup>${idx}</sup>${pre?`<span class="pre">${esc(pre)}</span>`:""}<input class="g" data-k="${key}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(3,w+1.5)}ch" aria-label="gap ${idx}" value="${esc(st[key]||"")}"></span>`,
    test:v=>same(v,list)||(pre&&same(pre+v,list))};
}
function buildGaps(t,box,dialog){
  const st=STATE[t.id]||(STATE[t.id]={});const tests={};let n=0;
  const fill=s=>esc(s).replace(/\{([^}]+)\}/g,(m,spec)=>{n++;const key="k"+n;const g=gapInput(spec.replace(/&amp;/g,"&"),n,st,key);tests[key]=g.test;return g.html});
  const d=document.createElement("div");d.className="text";
  if(dialog){d.innerHTML=`<div class="dlg">${t.lines.map(([who,l])=>`<span class="who ${who==="B"?"b":""}">${who}:</span><span>${fill(l)}</span>`).join("")}</div>`}
  else d.innerHTML=t.html.replace(/<p>(.*?)<\/p>/g,(m,p)=>`<p>${fill(p).replace(/&lt;/g,"<").replace(/&gt;/g,">")}</p>`);
  box.appendChild(d);
  d.addEventListener("input",e=>{const i=e.target.closest("input");if(!i)return;st[i.dataset.k]=i.value;i.classList.remove("ok","bad")});
  return {check(){let ok=0;d.querySelectorAll("input").forEach(i=>{const good=tests[i.dataset.k](i.value);if(good)ok++;i.classList.toggle("ok",good);i.classList.toggle("bad",!good)});return {ok,total:n}},
    reset(){d.querySelectorAll("input.bad").forEach(i=>{i.value="";st[i.dataset.k]="";i.classList.remove("bad")})}};
}
function buildRewrite(t,box){
  const st=STATE[t.id]||(STATE[t.id]={});const wrap=document.createElement("div");wrap.className="items";
  t.items.forEach(([q,m,a],i)=>{const r=document.createElement("div");r.className="rw";
    r.innerHTML=`<div class="q">${i+1}. ${esc(q)} <em>(${m})</em></div><input class="w" data-i="${i}" autocomplete="off" spellcheck="false" aria-label="sentence ${i+1}" value="${esc(st[i]||"")}" placeholder="${m==="?"?"Question…":"Negative…"}">`;wrap.appendChild(r)});
  box.appendChild(wrap);
  wrap.addEventListener("input",e=>{const i=e.target.closest("input");if(!i)return;st[i.dataset.i]=i.value;i.classList.remove("ok","bad")});
  return {check(){let ok=0;wrap.querySelectorAll("input").forEach(inp=>{const good=same(inp.value,t.items[+inp.dataset.i][2]);if(good)ok++;inp.classList.toggle("ok",good);inp.classList.toggle("bad",!good)});return {ok,total:t.items.length}},
    reset(){wrap.querySelectorAll("input.bad").forEach(i=>{i.value="";st[i.dataset.i]="";i.classList.remove("bad")})}};
}
const PAIRC=["#ff9ec7","#a98bf0","#4fbf96","#f0b429","#6aa5ff","#ff8a5c","#c56bd6","#3fb0b0","#e46a6a","#8b8b3a"];
function buildMatch(t,box){
  const st=STATE[t.id]||(STATE[t.id]={pairs:{},sel:null});
  const d=document.createElement("div");d.className="match";
  d.innerHTML=`<div class="col" id="mL"></div><div class="col" id="mR"></div>`;box.appendChild(d);
  const L=d.querySelector("#mL"),R=d.querySelector("#mR"),letters="abcdefghij";
  const paint=()=>{
    const rev={};for(const l in st.pairs)rev[st.pairs[l]]=+l;
    L.innerHTML=t.left.map((w,i)=>{const p=st.pairs[i];return `<button class="mi${st.sel===i?" sel":""}" data-l="${i}"><span class="k">${i+1}</span>${esc(w)}${p!=null?`<span class="pair" style="background:${PAIRC[i]}">${letters[p]}</span>`:""}</button>`}).join("");
    R.innerHTML=t.right.map((w,j)=>{const l=rev[j];return `<button class="mi" data-r="${j}" ${l!=null?`style="border-color:${PAIRC[l]}"`:""}><span class="k">${letters[j]}</span>${esc(w)}${l!=null?`<span class="pair" style="background:${PAIRC[l]}">${l+1}</span>`:""}</button>`}).join("");
  };
  d.addEventListener("click",e=>{const b=e.target.closest(".mi");if(!b)return;
    if(b.dataset.l!=null){const i=+b.dataset.l;st.sel=st.sel===i?null:i;paint();return}
    const j=+b.dataset.r;if(st.sel==null){for(const l in st.pairs)if(st.pairs[l]===j){delete st.pairs[l]}paint();return}
    for(const l in st.pairs)if(st.pairs[l]===j)delete st.pairs[l];st.pairs[st.sel]=j;st.sel=null;paint()});
  paint();
  return {check(){let ok=0;paint();L.querySelectorAll(".mi").forEach(b=>{const i=+b.dataset.l;const good=st.pairs[i]===t.ans[i];if(good)ok++;b.classList.add(good?"ok":"bad")});return {ok,total:t.left.length}},
    reset(){t.left.forEach((_,i)=>{if(st.pairs[i]!==t.ans[i])delete st.pairs[i]});paint()}};
}
function buildSort(t,box){
  const st=STATE[t.id]||(STATE[t.id]={place:{},sel:null,marks:{}});
  const d=document.createElement("div");box.appendChild(d);
  const paint=()=>{
    const chip=(w,i)=>`<button class="chip${st.sel===i?" sel":""}${st.marks[i]?" "+st.marks[i]:""}" data-w="${i}">${esc(w[0])}</button>`;
    d.innerHTML=`<div class="bank" data-g="-1">${t.words.map((w,i)=>st.place[i]==null?chip(w,i):"").join("")||'<span style="color:var(--muted);font-weight:700">All words are in groups ✓</span>'}</div>
      <div class="groups">${t.groups.map((g,gi)=>`<div class="grp${st.sel!=null?" ready":""}" data-g="${gi}" role="button" tabindex="0"><h3>${g}</h3><div class="in">${t.words.map((w,i)=>st.place[i]===gi?chip(w,i):"").join("")}</div></div>`).join("")}</div>`;
  };
  d.addEventListener("click",e=>{

function buildListen(t,box){
  const st=STATE[t.id]||(STATE[t.id]={});
  const a=document.createElement("div");a.className="audio";
  a.innerHTML=`<label for="mp3">🎧 Аудио к заданию</label><audio id="aud" controls ${audioURL?`src="${audioURL}"`:""}></audio>
    <div style="font-size:14px;font-weight:700;color:var(--muted)">Можно заменить аудио: выберите другой mp3.</div><input type="file" id="mp3" accept="audio/*">`;
  box.appendChild(a);
  a.querySelector("#mp3").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;if(audioURL&&audioURL.startsWith("blob:"))URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(f);a.querySelector("#aud").src=audioURL});
  const l=document.createElement("div");l.className="lis";
  l.innerHTML=t.items.map((w,i)=>`<div class="row"><b>${i+1}. <span>${esc(w)}</span></b><input class="w" data-i="${i}" autocomplete="off" aria-label="sentence ${i+1}" value="${esc(st[i]||"")}" placeholder="Write the sentence…"></div>`).join("");
  box.appendChild(l);
  l.addEventListener("input",e=>{const i=e.target.closest("input");if(i){st[i.dataset.i]=i.value;i.classList.remove("ok","bad")}});
  const nc=x=>norm(String(x).replace(/,/g," "));
  return {check(){let ok=0;l.querySelectorAll("input").forEach(inp=>{const good=t.ans[+inp.dataset.i].some(a=>nc(a)===nc(inp.value));if(good)ok++;inp.classList.toggle("ok",good);inp.classList.toggle("bad",!good)});return {ok,total:t.items.length}},
    reset(){l.querySelectorAll("input.bad").forEach(i=>{i.value="";st[i.dataset.i]="";i.classList.remove("bad")})}};
}

/* ---------- pages ---------- */
function render(){
  const P=PAGES[page];const m=$("#main");m.innerHTML="";
  $("#bar").style.width=(page/(PAGES.length-1)*100)+"%";
  $("#step").textContent=(page+1)+" / "+PAGES.length;
  $("#prev").disabled=page===0;$("#prev").style.visibility=page===0?"hidden":"visible";
  $("#next").textContent=page===PAGES.length-1?"В начало ↺":page===PAGES.length-2?"Итоги →":"Дальше →";
  const pg=document.createElement("section");pg.className="page";m.appendChild(pg);
  if(P.k==="intro")return intro(pg);
  if(P.k==="speakQ")return speakQ(pg);
  if(P.k==="speakC")return speakC(pg);
  if(P.k==="results")return results(pg);
  const t=P.t;
  pg.innerHTML=`<span class="tag ${t.sec==="Vocabulary"?"v":""}">${t.sec}</span><h2><span class="n">${t.n}</span>${esc(t.title)}</h2><p class="instr">${esc(t.instr)}</p>`;
  const box=document.createElement("div");pg.appendChild(box);
  const api=t.type==="choice"?buildChoice(t,box):t.type==="gaps"?buildGaps(t,box,false):t.type==="dialog"?buildGaps(t,box,true):
    t.type==="rewrite"?buildRewrite(t,box):t.type==="match"?buildMatch(t,box):t.type==="sort"?buildSort(t,box):buildListen(t,box);
  const acts=document.createElement("div");acts.className="acts";pg.appendChild(acts);
  if(!api){acts.innerHTML=`<span class="pill no">Это задание проверит учитель — ответы уйдут в итоги</span>`;return}
  acts.innerHTML=`<button class="btn mint" id="chk">✓ Проверить</button><button class="btn ghost" id="again" hidden>↺ Исправить ошибки</button><button class="btn ghost" id="hb">💡 Подсказка</button><span class="score" id="sc"></span>`;
  const hint=document.createElement("div");hint.className="hint";hint.hidden=true;hint.innerHTML=t.hint||"";pg.appendChild(hint);
  const show=r=>{const s=$("#sc");s.textContent=`${r.ok} / ${r.total}`+(r.ok===r.total?" — Perfect! 🎉":"");s.className="score "+(r.ok===r.total?"ok":"mid");$("#again").hidden=r.ok===r.total};
  $("#chk").onclick=()=>{const r=api.check();const prev=RES[t.id];RES[t.id]={ok:r.ok,total:r.total,tries:(prev?prev.tries:0)+1};show(r);if(r.ok===r.total)confetti()};
  $("#again").onclick=()=>{api.reset();$("#sc").textContent="";$("#again").hidden=true};
  $("#hb").onclick=()=>{hint.hidden=!hint.hidden};
  if(RES[t.id]){const r=api.check();show(r)}
}
function intro(pg){
  pg.innerHTML=`<div class="hello"><div><span class="tag s">Review lesson</span><h1>Grammar &amp; Vocabulary</h1>
    <p class="instr" style="margin:0">Past simple, questions, places in town, home and holidays.</p>
    <div class="name"><input id="nm" placeholder="Your name" aria-label="Your name" value="${esc(name)}"><button class="btn pink big" id="go">Start ☁</button></div></div>
    <div class="cloud" aria-hidden="true">☁️<br>🧳</div></div>
    <ul class="plan">${TASKS.map(t=>`<li>${t.n}. ${esc(t.title)}</li>`).join("")}<li>🗣 Speaking: questions</li><li>🃏 Speaking: cards</li></ul>`;
  const save=()=>{name=$("#nm").value.trim();try{localStorage.setItem("rv_name",name)}catch(e){}};
  $("#nm").addEventListener("input",save);
  $("#go").onclick=()=>{save();go(1)};
}
let qi=0;
function speakQ(pg){
  const paint=()=>{const [q,s]=QUESTIONS[qi];
    pg.querySelector(".qcard").innerHTML=`<div class="qn">Question ${qi+1} of ${QUESTIONS.length}</div><div class="qq">${esc(q)}</div><div class="starters">${s.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`};
  pg.innerHTML=`<span class="tag s">Speaking</span><h2>🗣 Let's talk!</h2><p class="instr">Answer in full sentences. Try to say 2–3 sentences for each question.</p>
    <div class="qcard"></div><div class="acts" style="justify-content:center"><button class="btn ghost" id="qp">← Previous</button><button class="btn ghost" id="qr">🎲 Random</button><button class="btn pink" id="qn">Next question →</button></div>`;
  $("#qp").onclick=()=>{qi=(qi-1+QUESTIONS.length)%QUESTIONS.length;paint()};
  $("#qn").onclick=()=>{qi=(qi+1)%QUESTIONS.length;paint()};
  $("#qr").onclick=()=>{let n;do{n=Math.floor(Math.random()*QUESTIONS.length)}while(n===qi&&QUESTIONS.length>1);qi=n;paint()};
  paint();
}
let tmr=null;
function speakC(pg){
  pg.innerHTML=`<span class="tag s">Speaking</span><h2>🃏 Speaking cards</h2><p class="instr">Choose a card and turn it over. Talk for one minute!</p>
    <div class="timerbox"><span class="timer" id="tm">1:00</span><button class="btn mint" id="ts">▶ Start 1 minute</button><button class="btn ghost" id="tr">↺</button></div>
    <div class="cards">${CARDS.map(([e,t,l],i)=>`<button class="fc" data-i="${i}" aria-label="${esc(t)}"><span class="inn"><span class="f" style="background:${["var(--pink-soft)","var(--lilac-soft)","var(--mint-soft)","var(--sun-soft)"][i%4]}"><span class="e">${e}</span><span class="t">${esc(t)}</span><small>tap to turn</small></span><span class="b"><h4>${e} ${esc(t)}</h4><ul>${l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></span></span></button>`).join("")}</div>`;
  pg.querySelector(".cards").addEventListener("click",e=>{const c=e.target.closest(".fc");if(c)c.classList.toggle("flip")});
  let left=60;const show=()=>{$("#tm").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0")};
  $("#ts").onclick=()=>{clearInterval(tmr);left=60;show();$("#ts").textContent="⏳ Talking…";tmr=setInterval(()=>{left--;show();if(left<=0){clearInterval(tmr);$("#ts").textContent="▶ Start 1 minute";confetti()}},1000)};
  $("#tr").onclick=()=>{clearInterval(tmr);left=60;show();$("#ts").textContent="▶ Start 1 minute"};
}
function summary(){
  const d=new Date();const lines=[`📘 Grammar & Vocabulary Review`,`Ученик: ${name||"—"}`,`Дата: ${d.toLocaleDateString("ru-RU")} ${d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}`,""];
  let ok=0,tot=0;
  TASKS.forEach(t=>{
    const r=RES[t.id];if(r){ok+=r.ok;tot+=r.total;lines.push(`${t.n}. ${t.title}: ${r.ok}/${r.total}${r.ok===r.total?" ✅":""} (попыток: ${r.tries})`)}else lines.push(`${t.n}. ${t.title}: не проверено`)});
  const ls=STATE.g5||{};lines.push("","Аудирование (что написал ученик):");TASKS.find(t=>t.id==="g5").items.forEach((w,i)=>lines.push(`   ${i+1}) ${ls[i]||"—"}`));
  lines.push("",`Итого: ${ok}/${tot}`);return lines.join("\n");
}
function results(pg){
  let ok=0,tot=0;
  const rows=TASKS.map(t=>{
    const r=RES[t.id];if(!r)return `<tr><td>${t.n}. ${esc(t.title)}</td><td><span class="pill no">не проверено</span></td></tr>`;
    ok+=r.ok;tot+=r.total;const c=r.ok===r.total?"ok":"mid";return `<tr><td>${t.n}. ${esc(t.title)}</td><td><span class="pill ${c}">${r.ok} / ${r.total}</span></td></tr>`}).join("");
  pg.innerHTML=`<span class="tag s">Results</span><h2>📋 ${esc(name||"Your")} results</h2><p class="instr">Всего верно: <b>${ok} / ${tot}</b></p>
    <table class="res">${rows}</table>
    <div class="acts"><a class="btn pink big" id="send" href="https://t.me/${TEACHER}" target="_blank" rel="noopener" style="text-decoration:none">✈️ Отправить учителю</a></div>
    <div class="sent" id="sentMsg" hidden></div><textarea class="copy" id="copyBox" readonly hidden aria-label="Results text"></textarea>`;
  $("#send").addEventListener("click",()=>{
    const txt=summary();const box=$("#copyBox");box.value=txt;
    const done=()=>{$("#sentMsg").hidden=false;$("#sentMsg").textContent="Итоги скопированы ✓ Вставь их в чат с учителем в Telegram (@"+TEACHER+")."};
    const fallback=()=>{box.hidden=false;box.focus();box.select();$("#sentMsg").hidden=false;$("#sentMsg").textContent="Скопируй текст ниже и отправь учителю в Telegram (@"+TEACHER+").";};
    try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}
  });
}
function go(p){page=Math.max(0,Math.min(PAGES.length-1,p));clearInterval(tmr);render();window.scrollTo({top:0,behavior:"smooth"})}
$("#prev").onclick=()=>go(page-1);
$("#next").onclick=()=>go(page===PAGES.length-1?0:page+1);
$("#resBtn").onclick=()=>go(PAGES.length-1);
$("#fsBtn").onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener("fullscreenchange",()=>{$("#fsBtn").textContent=document.fullscreenElement?"✕ Выйти":"⛶ На весь экран"});
render();
window.__test={TASKS,norm,same,go,RES,STATE};
})();
</script>
</body>
</html>
